version: 2

project_name: enver

before:
  hooks:
    - go mod tidy

builds:
  - id: enver
    main: ./cmd/enver
    binary: enver
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/neiromaster/enver/internal/version.Version={{.Version}} -X github.com/neiromaster/enver/internal/version.Commit={{.Commit}} -X github.com/neiromaster/enver/internal/version.Date={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - ids: [enver]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README*
      - completions/enver.bash
      - completions/enver.zsh
      - completions/enver.fish
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: neiromaster
    name: enver

homebrew_casks:
  - name: enver
    repository:
      owner: neiromaster
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/neiromaster/enver"
    description: "Inject environment variables from layered YAML profiles into any command"
    license: "MIT"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    binaries:
      - enver
    completions:
      bash: completions/enver.bash
      zsh: completions/enver.zsh
      fish: completions/enver.fish
    # Clear quarantine so the unsigned binary runs without manual Gatekeeper
    # approval. install_steps renders Homebrew's declarative DSL; the raw-Ruby
    # install hook it replaces renders the deprecated postflight stanza, which
    # warns on every brew command. The macOS guard matters: the cask covers
    # Linux too, where there is no /usr/bin/xattr.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
          end

gomod:
  proxy: true
version: 2

project_name: enver

before:
  hooks:
    - go mod tidy

builds:
  - id: enver
    main: ./cmd/enver
    binary: enver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/neiromaster/enver/internal/version.Version={{.Version}} -X github.com/neiromaster/enver/internal/version.Commit={{.Commit}} -X github.com/neiromaster/enver/internal/version.Date={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: enverx
    main: ./cmd/enverx
    binary: enverx
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/neiromaster/enver/internal/version.Version={{.Version}} -X github.com/neiromaster/enver/internal/version.Commit={{.Commit}} -X github.com/neiromaster/enver/internal/version.Date={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - ids: [enver, enverx]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: neiromaster
    name: enver

homebrew_casks:
  - name: enver
    repository:
      owner: neiromaster
      name: homebrew-enver
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/neiromaster/enver"
    description: "Inject environment variables from layered YAML profiles into any command"
    license: "MIT"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    binaries:
      - enver
      - enverx
    generate_completions_from_executable:
      executable: "enver"
      args: ["completion"]
      base_name: "enver"
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish

gomod:
  proxy: true
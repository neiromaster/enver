version: 2

project_name: enver

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/enver
    binary: enver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: neiromaster
    name: enver

homebrew_casks:
  - name: enver
    repository:
      owner: neiromaster
      name: homebrew-enver
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/neiromaster/enver"
    description: "Inject environment variables from layered YAML profiles into any command"
    license: "MIT"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    binaries:
      - enver
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/enver"]
          end

gomod:
  proxy: true
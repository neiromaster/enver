name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: golangci-lint
        run: |
          echo "::add-matcher::.github/golangci-lint-problem-matcher.json"
          go tool golangci-lint run

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: coverage gate
        if: runner.os == 'Linux'
        env:
          GOCOVERDIR: ${{ github.workspace }}/.coverage
          ENVER_E2E_COVER: "1"
          MIN_COVER: "78"
        run: |
          mkdir -p "$GOCOVERDIR"
          UNIT_PKGS=$(go list ./... | grep -v '/test/e2e')
          ENVER_E2E_COVER=1 GOCOVERDIR="$GOCOVERDIR" go test -race -count=1 -cover -coverpkg=./... $UNIT_PKGS -args -test.gocoverdir="$GOCOVERDIR"
          ENVER_E2E_COVER=1 GOCOVERDIR="$GOCOVERDIR" go test -race -count=1 ./test/e2e
          go tool covdata textfmt -i="$GOCOVERDIR" -o coverage.txt
          total=$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%",""); print $NF}')
          echo "total coverage: ${total}% (gate: ${MIN_COVER}%)"
          if ! awk -v t="$total" -v m="$MIN_COVER" 'BEGIN { exit !(t+0 > m+0) }'; then
            echo "::error::coverage ${total}% is not above the gate ${MIN_COVER}%"
            exit 1
          fi
          hit=$(grep -E 'exec_(windows|unix)\.go' coverage.txt | awk '$NF > 0' | head -1 || true)
          if [ -z "$hit" ]; then
            echo "::error::unit covdata missing: no covered exec_* spawn-failure line"
            exit 1
          fi

      - name: upload coverage
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore
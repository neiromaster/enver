name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate shell completions
        run: bash scripts/generate-completions.sh

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope on neiromaster/homebrew-enver, so goreleaser
          # can push the cask to the tap repo. Add as a repo secret named
          # HOMEBREW_TAP_GITHUB_TOKEN in neiromaster/enver. Without it, the
          # GitHub Release is still published; only the cask push is skipped.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: bash scripts/publish-npm.sh "${GITHUB_REF_NAME#v}"
name: Release

on:
  push:
    tags:
      - "v*"
  # Republish npm for an already-released tag. Publishing is bound to this
  # workflow file for the OIDC trusted-publisher link, so it cannot live in a
  # separate workflow — but it can be dispatched on its own, which is the only
  # way to retry it: re-running the failed job of a tag build starts at
  # goreleaser, which then fails on the assets it already uploaded.
  workflow_dispatch:
    inputs:
      npm_version:
        description: "Version to publish to npm, e.g. 0.9.4 (no v prefix)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race ./...

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate shell completions
        run: bash scripts/generate-completions.sh

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope on neiromaster/homebrew-tap, so goreleaser
          # can push the cask to the tap repo. Add as a repo secret named
          # HOMEBREW_TAP_GITHUB_TOKEN in neiromaster/enver. Without it, the
          # GitHub Release is still published; only the cask push is skipped.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  npm:
    needs: [test, release]
    # always() so a dispatch — where both upstream jobs are skipped — still
    # reaches npm; the explicit guard keeps a failed release from publishing.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_version || github.ref_name }}
        run: bash scripts/publish-npm.sh "${VERSION#v}"

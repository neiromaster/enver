# Dependabot: weekly checks for Go modules and GitHub Actions. Minor/patch are
# grouped to limit PR noise; major bumps open separately for careful review.
# Commits use the chore(deps) prefix, which goreleaser's changelog excludes.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      go:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      go:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
